    help_text: "특징점 매칭에 사용할 참조 이미지에서 기준이 되는 위치를 지정합니다. 형식은 [x, y]입니다."
    access_level: user          # 접근 레벨은 user로 설정되어 있어 모든 사용자가 이 파라미터를 볼 수 있습니다.
