#############################################
### 파라미터 정의 정보                     ###
#############################################
parameters:
#############################################
### COMMON 모듈 파라미터 정의 정보         ###
  - name: module_type
    label: "모듈 유형"
    type: choice
    default: "SCW_RIGHT"
    min: null
    max: null
    options:
      - "SCW_RIGHT"
      - "SCW_LEFT"
      - "PTD_RIGHT"
    group: null                 # 그룹은 UI에서 파라미터를 논리적으로 묶어주는 역할을 합니다. 같은 그룹에 속한 파라미터들은 UI에서 함께 표시됩니다.
    feature: "PR_NZ_CENTER"     # 기능은 UI에서 파라미터가 속한 기능을 나타냅니다. 같은 기능에 속한 파라미터들은 UI에서 함께 표시될 수 있습니다.
    module: "COMMON"            # 모듈은 UI에서 파라미터가 속한 모듈을 나타냅니다. 같은 모듈에 속한 파라미터들은 UI에서 함께 표시될 수 있습니다.
    help_text: "PRD_NZ_CENTER 검사에서 사용할 모듈 유형을 선택합니다."
    access_level: engineer      # 접근 레벨은 engineer로 설정되어 있어 엔지니어만 이 파라미터를 볼 수 있습니다.
    visibility: visible         # 기본값은 visible이며, hidden으로 설정하면 해당 파라미터는 UI에서 보이지 않게 됩니다.

# 캘리브레션을 위한 좌표 추출을 위한 매칭 관련 파라미터들입니다. 참조 이미지 경로, 템플릿 ROI, 검색 ROI, 참조 위치 등을 포함합니다.
# calibration_pos1 그룹에 속한 파라미터들은 PR_NZ_CENTER 기능과 관련된 캘리브레션을 위한 좌표 추출에 사용됩니다. 이 그룹에는 참조 이미지 경로, 템플릿 ROI, 검색 ROI, 참조 위치 등의 파라미터가 포함되어 있습니다. 이러한 파라미터들은 특징점 매칭을 수행하기 위한 설정을 제공하며, 사용자 접근 레벨에 따라 보이거나 숨겨질 수 있습니다.
  - name: ref_image_path
    label: "참조 이미지"
    type: path
    default: "./images/pos1.bmp"
    min: null 
    max: null
    options:
      - "*.jpg"
      - "*.png"
      - "*.bmp"
      - "*.*"
    group: "Calibration"        # 그룹은 UI에서 파라미터를 논리적으로 묶어주는 역할을 합니다. 같은 그룹에 속한 파라미터들은 UI에서 함께 표시됩니다.
    section: "Position1"        # 섹션은 그룹 내에서 파라미터를 더 세부적으로 묶어주는 역할을 합니다. 같은 섹션에 속한 파라미터들은 UI에서 함께 표시됩니다.
    feature: "PR_NZ_CENTER"     # 기능은 UI에서 파라미터가 속한 기능을 나타냅니다. 같은 기능에 속한 파라미터들은 UI에서 함께 표시될 수 있습니다.
    module: "COMMON"            # 모듈은 UI에서 파라미터가 속한 모듈을 나타냅니다. 같은 모듈에 속한 파라미터들은 UI에서 함께 표시될 수 있습니다.
    help_text: "특징점 매칭에 사용할 참조 이미지 파일 경로를 지정합니다."
    access_level: user          # 접근 레벨은 user로 설정되어 있어 모든 사용자가 이 파라미터를 볼 수 있습니다.
    visibility: visible         # 기본값은 visible이며, hidden으로 설정하면 해당 파라미터는 UI에서 보이지 않게 됩니다.
  - name: template_roi
    label: "템플릿 ROI"
    type: roi
    default: [100, 100, 200, 200]
    min: null 
    max: null
    options: null
    group: "Calibration"        # 그룹은 UI에서 파라미터를 논리적으로 묶어주는 역할을 합니다. 같은 그룹에 속한 파라미터들은 UI에서 함께 표시됩니다.
    section: "Position1"         # 섹션은 그룹 내에서 파라미터를 더 세부적으로 묶어주는 역할을 합니다. 같은 섹션에 속한 파라미터들은 UI에서 함께 표시됩니다.
    feature: "PR_NZ_CENTER"     # 기능은 UI에서 파라미터가 속한 기능을 나타냅니다. 같은 기능에 속한 파라미터들은 UI에서 함께 표시될 수 있습니다.
    module: "COMMON"            # 모듈은 UI에서 파라미터가 속한 모듈을 나타냅니다. 같은 모듈에 속한 파라미터들은 UI에서 함께 표시될 수 있습니다.
    help_text: "특징점 매칭에 사용할 템플릿 이미지 관심 영역(ROI)을 지정합니다. 형식은 [x, y, width, height]입니다."
    access_level: user          # 접근 레벨은 user로 설정되어 있어 모든 사용자가 이 파라미터를 볼 수 있습니다.
    visibility: visible         # 기본값은 visible이며, hidden으로 설정하면 해당 파라미터는 UI에서 보이지 않게 됩니다.
  - name: search_roi
    label: "검색 ROI"
    type: roi
    default: [0, 0, 400, 400]
    min: null 
    max: null
    options: null
    group: "Calibration"        # 그룹은 UI에서 파라미터를 논리적으로 묶어주는 역할을 합니다. 같은 그룹에 속한 파라미터들은 UI에서 함께 표시됩니다.
