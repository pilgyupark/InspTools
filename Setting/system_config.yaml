- id: camera_config
  label: 카메라 설정
  type: null
  auth_level: 4
  params:
  - {id: max_retries, label: 최대 재시도 횟수, type: int, value: 5, min: 0, auth_level: 4, help: 카메라 연결이 실패할 때 재시도할 최대 횟수입니다.}
  - {id: retry_delay, label: 재시도 간격(s), type: float, value: 1.0, min: 0.0, max: 10.0, auth_level: 4, help: 카메라 연결이 실패할 때 재시도하기 전에 기다리는 시간입니다.}
  - {id: connection_timeout, label: 연결 타임아웃(s), type: float, value: 5.0, min: 0.0, max: 30.0, auth_level: 4, help: 카메라에 연결할 때 기다리는 최대 시간입니다.}
  - {id: frame_capture_timeout, label: 프레임 캡처 타임아웃(s), type: float, value: 2.0, min: 0.0, max: 30.0, auth_level: 4, help: 카메라에서 프레임을 캡처할 때 기다리는 최대 시간입니다.}
  - {id: frame_sync_delay, label: 프레임 싱크 지연 시간(s), type: float, value: 0.1, min: 0.0, max: 0.2, auth_level: 4, help: 카메라에서 프레임 싱크를 맞추기 위해 캡처된 프레임을 처리하기 전에 기다리는 기본 시간입니다.}
  - {id: frame_interval, label: 프레임 간격(s), type: float, value: 0.034, min: 0.01, max: 1.0, auth_level: 4, help: 카메라에서 프레임을 캡처하는 기본 간격입니다.}
  - {id: min_frame_count, label: 최소 프레임 수, type: int, value: 1, min: 1, max: 10, auth_level: 4, help: 카메라에서 캡처할 최소 프레임 수입니다.}
  - {id: frame_save, label: 프레임 저장 여부, type: bool, value: false, auth_level: 4, help: 캡처된 프레임을 파일로 저장할지 여부입니다.}
