  - {id: retry_delay, label: 재시도 간격(s), value: 1.0, type: float, min: 0.0, max: 10.0, auth_level: 4, help: 카메라 연결이 실패할 때 재시도하기 전에 기다리는 시간입니다.}
  - {id: connection_timeout, label: 연결 타임아웃(s), value: 5.0, type: float, min: 0.0, max: 30.0, auth_level: 4, help: 카메라에 연결할 때 기다리는 최대 시간입니다.}
