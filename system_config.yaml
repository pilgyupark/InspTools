# 사용자 정보 (level: 1=Operator, 2=Engineer, 3=Admin)
user_management:
  - { id: "admin", role: "관리자", level: 3, pw_hash: "8c69..." }
    - { id: "op01", role: "작업자", level: 1, pw_hash: "5e88..." }

    # 모듈(Module) > 유닛(Unit) > 파라미터(Param) 계층
    modules:
      - id: "align_module"
          label: "얼라인 모듈"
              units:
                    - id: "camera_unit"
                            label: "카메라 유닛"
                                    auth_level: 1
                                            params:
                                                      - { id: "exposure", label: "노출 시간", value: 5000, type: "int", min: 0, max: 10000, help: "카메라 노출 값입니다." }
                                                            - id: "lighting_unit"
                                                                    label: "조명 유닛"
                                                                            auth_level: 2
                                                                                    params:
                                                                                              - { id: "brightness", label: "조명 밝기", value: 255, type: "int", min: 0, max: 255, help: "조명 제어기 값입니다." }

                                                                                                - id: "inspection_module"
                                                                                                    label: "검사 모듈"
                                                                                                        auth_level: 3 # 모듈 전체가 관리자 전용
                                                                                                            units:
                                                                                                                  - id: "vision_unit"
                                                                                                                          label: "알고리즘 유닛"
                                                                                                                                  params:
                                                                                                                                            - { id: "threshold", label: "이진화 임계값", value: 128, type: "int", min: 0, max: 255 }
                                                                                                                                            